# Core Application Configuration
spring.application.name=emergency-assistance-backend
server.port=${PORT:8080}

# Default Active Profile: dev (H2 in MySQL mode with initial seeds for frictionless running and testing)
# In production on Render, set SPRING_PROFILES_ACTIVE=postgres (or SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA & Hibernate Defaults
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# Security & JWT (Stateless Authentication)
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Frontend & CORS Configuration
frontend.url=${FRONTEND_URL:https://emergency-alert-and-hospital-assistance-system.vercel.app}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,https://emergency-alert-and-hospital-assist.vercel.app,https://emergency-alert-and-hospital-assistance-system.vercel.app}}

# Flyway Default (Enabled in application-postgres.properties and application-prod.properties)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

# External AI Integration (Google Gemini)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# Supabase Project & Storage Configuration (Optional / Prepared for Storage & Services)
supabase.url=${SUPABASE_URL:}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.jwks-url=${SUPABASE_JWKS_URL:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:emergency-attachments}

# OpenAPI / Swagger Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
