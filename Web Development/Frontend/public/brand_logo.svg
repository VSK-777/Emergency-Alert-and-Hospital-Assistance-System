<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background: Deep Tech Obsidian Slate Gradient -->
    <radialGradient id="techBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Shield Face Gradient: Titanium Glass -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#090E17" stop-opacity="0.98" />
    </linearGradient>

    <!-- Shield Border: Cyan to Emergency Crimson Spectrum -->
    <linearGradient id="shieldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Medical Cross Gradient: High-Vibrancy Emergency Crimson -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <!-- Subtle Glow for Pulse Wave -->
    <filter id="ecgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#techBg)" stroke="#334155" stroke-width="3.5" stroke-opacity="0.5" />

  <!-- Radiating Emergency Dispatch Radar Arcs -->
  <path d="M 212, 78 A 48,48 0 0,1 300, 78" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" stroke-opacity="0.55" />
  <path d="M 188, 54 A 78,78 0 0,1 324, 54" fill="none" stroke="#38BDF8" stroke-width="5.5" stroke-linecap="round" stroke-opacity="0.25" />

  <!-- Protective Shield Contour -->
  <path d="M 256, 102 C 344, 102 414, 126 414, 204 C 414, 328 324, 410 256, 444 C 188, 410 98, 328 98, 204 C 98, 126 168, 102 256, 102 Z"
        fill="url(#shieldFill)"
        stroke="url(#shieldStroke)"
        stroke-width="10"
        stroke-linejoin="round" />

  <!-- Medical Cross Elements -->
  <!-- Vertical Beam -->
  <rect x="224" y="146" width="64" height="236" rx="20" fill="url(#crossGrad)" />
  <!-- Horizontal Arms -->
  <rect x="138" y="234" width="236" height="64" rx="20" fill="url(#crossGrad)" />

  <!-- Precision ECG Pulse Waveform -->
  <path d="M 124, 266 L 194, 266 L 214, 230 L 236, 318 L 260, 178 L 286, 344 L 306, 246 L 322, 266 L 388, 266"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="13"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#ecgGlow)" />

  <!-- Emergency Dispatch Beacon Core -->
  <circle cx="256" cy="102" r="10" fill="#38BDF8" />
  <circle cx="256" cy="102" r="15" fill="none" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.8" />
</svg>
