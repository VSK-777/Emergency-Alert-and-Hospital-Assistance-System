# =============================================================================
# PostgreSQL Profile for Neon Serverless Cloud Deployment
# Emergency Alert and Hospital Assistance System - VVIT CSP
# =============================================================================

# Datasource Configuration using Neon Serverless PostgreSQL (Port 5432)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-odd-art-b3wr3a72-pooler.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate: Production validation against Flyway migrations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# Flyway Database Migration
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Explicitly disable H2 Console in production
spring.h2.console.enabled=false

# Security: Error Handling & Masking
server.error.include-stacktrace=never
server.error.include-message=never
