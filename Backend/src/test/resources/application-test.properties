# =============================================================================
# Test Configuration: Flyway Schema Verification & Automated Integration Tests
# =============================================================================

spring.datasource.url=jdbc:h2:mem:test_emergency_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate strictly validates that entities match Flyway migrations
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Flyway Migrations Enabled
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

