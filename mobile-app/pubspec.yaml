name: emergency_assistance_app
description: "Emergency Alert and Hospital Assistance System Mobile App - VVIT B.Tech CSE Batch 8"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking & Connectivity
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # Local Persistence & Security
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  uuid: ^4.4.0
  intl: ^0.19.0

  # Mapping (OpenStreetMap based)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Icons
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  flutter_blue_plus: ^2.3.14
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/first_aid.json
